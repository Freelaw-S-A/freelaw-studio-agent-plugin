name: Live MCP readiness

on:
  workflow_dispatch:
    inputs:
      catalog_smoke:
        description: Require the reviewer credential and verify the authenticated tool catalog
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize sanitized receipt
        env:
          RECEIPT_PATH: ${{ runner.temp }}/freelaw-live-readiness/receipt.json
        run: |
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          printf '%s\n' '{"schemaVersion":"1.0.0","checkedAt":null,"status":"not_started","mode":"unknown","packageVersion":null,"serverUrl":null,"credentialConfigured":null,"publicTransportVerified":false,"authenticatedToolScanVerified":false,"toolCount":null,"submissionReady":false,"oauthConsentFlowVerified":false,"reviewCasesExecuted":false,"failureCode":null}' > "$RECEIPT_PATH"
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Check current public discovery and OAuth challenge
        if: inputs.catalog_smoke == false
        run: >-
          bun scripts/run-live-readiness.mjs
          --mode public
          --output "$RUNNER_TEMP/freelaw-live-readiness/receipt.json"
      - name: Check current authenticated tool catalog
        if: inputs.catalog_smoke == true
        env:
          FREELAW_REVIEW_MCP_TOKEN: ${{ secrets.FREELAW_REVIEW_MCP_TOKEN }}
        run: >-
          bun scripts/run-live-readiness.mjs
          --mode catalog
          --output "$RUNNER_TEMP/freelaw-live-readiness/receipt.json"
      - name: Upload sanitized readiness receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-live-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/freelaw-live-readiness/receipt.json
          if-no-files-found: error
          retention-days: 14
