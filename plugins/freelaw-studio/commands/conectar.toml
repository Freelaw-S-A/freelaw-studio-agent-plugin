description = "Conectar este agente ao Freelaw Studio pelo MCP público."
prompt = """
Conecte ao Freelaw Studio.

1. Use o MCP remoto https://app.freelaw.ai/api/agent/mcp.
2. Complete OAuth 2.1 com PKCE no host. Não peça chave flk_ no chat.
3. Na primeira conexão, chame office.permissions.describe uma vez para validar o token. Não repita isso em toda pergunta.
4. Resuma o escritório autenticado, o papel, e o que o token pode ler ou escrever.
5. Depois da conexão, prefira uma tool de domínio (office.dailySummary.get para "o que tenho hoje").
6. Se a conexão falhar, reporte status HTTP, WWW-Authenticate e X-Correlation-ID sem vazar segredos.
"""
